# =============================================================================
#  ChirpStack network server configuration
# =============================================================================
#  The values written as dollar-sign names below are filled in from the .env
#  file when the stack starts.
#  In normal operation you edit .env, not this file.
#
#  The one thing you might come back here for: running MORE THAN ONE region on
#  the same server. See the note next to enabled_regions.
# =============================================================================

[logging]
  level="$LOG_LEVEL"


[postgresql]
  dsn="postgres://chirpstack:$POSTGRES_PASSWORD@$POSTGRESQL_HOST/chirpstack?sslmode=disable"
  max_open_connections=10
  min_idle_connections=0


[redis]
  servers=["redis://$REDIS_HOST/"]
  tls_enabled=false
  cluster=false


[network]

  # LoRaWAN network identifier. 000000 is correct for a private network.
  net_id="$NET_ID"

  # Which radio region this site runs. Driven by REGION in .env, which also
  # configures the gateway bridges and MQTT topics so they cannot drift apart.
  #
  # To run several regions at once, replace the line below with an explicit
  # list, for example:
  #     enabled_regions=["us915_0", "us915_1"]
  # Note that REGION in .env still decides which region the bundled gateway
  # bridges serve; extra regions need their own bridge.
  enabled_regions=["$REGION"]


[api]
  bind="0.0.0.0:8080"

  # Signs login sessions and API tokens. Generated per site by setup.sh.
  secret="$CHIRPSTACK_API_SECRET"


[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="$MQTT_BROKER_URL"
    username="$MQTT_USERNAME"
    password="$MQTT_PASSWORD"
    ca_cert="$MQTT_CA_CERT"
    json=true
