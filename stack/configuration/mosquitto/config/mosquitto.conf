# Base MQTT broker settings. Do not edit this file.
#
# The parts that change per site -- whether a login is required, and whether
# an encrypted listener is enabled -- are written into conf.d/ by
# ./sitesync apply, based on MQTT_AUTH_ENABLED and MQTT_TLS in your .env.

per_listener_settings false

listener 1883
protocol mqtt

persistence false

include_dir /mosquitto/conf.d
